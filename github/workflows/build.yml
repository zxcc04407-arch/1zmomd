name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o MinecraftMenuStarter.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: cd MinecraftMenuStarter && gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: MinecraftMenuStarter/build/libs/*.jar
